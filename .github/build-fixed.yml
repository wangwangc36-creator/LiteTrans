name: Build LiteTrans APK (AndroidX fix)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore embedded LiteTrans source
        shell: bash
        run: |
          awk '/cat > \/tmp\/litetrans-source.b64/{flag=1;next} /LITETRANS_EOF/{if(flag){exit}} flag {sub(/^          /, ""); print}' .github/workflows/build.yml > /tmp/litetrans-source.b64
          base64 -d /tmp/litetrans-source.b64 > /tmp/LiteTrans-source.zip
          rm -rf /tmp/litetrans-src
          mkdir -p /tmp/litetrans-src
          unzip -q /tmp/LiteTrans-source.zip -d /tmp/litetrans-src
          rsync -a --exclude='.github' /tmp/litetrans-src/LiteTrans/ ./
          sed -i 's/android.useAndroidX=false/android.useAndroidX=true/' gradle.properties

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiteTrans-0.1-alpha1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
