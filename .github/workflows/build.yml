name: Build LiteTrans APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Stamp Alpha6 UI text
        run: sed -i 's/Alpha4/Alpha6/g; s/Alpha5/Alpha6/g' app/src/main/java/com/litetrans/module/ui/MainActivity.java

      - name: Lint and build debug APK
        run: gradle --no-daemon :app:lintDebug :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LiteTrans-0.1.0-alpha6-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
