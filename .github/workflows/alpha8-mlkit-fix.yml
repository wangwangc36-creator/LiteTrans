name: Build LiteTrans alpha8 MLKit fix

on:
  workflow_dispatch:
  push:
    branches: [ alpha8-fix-build ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore baseline source
        shell: bash
        run: |
          awk '/cat > \/tmp\/litetrans-source.b64/{flag=1;next} /LITETRANS_EOF/{if(flag){exit}} flag {sub(/^          /, ""); print}' .github/workflows/build.yml > /tmp/litetrans-source.b64
          base64 -d /tmp/litetrans-source.b64 > /tmp/LiteTrans-source.zip
          rm -rf /tmp/litetrans-src
          mkdir -p /tmp/litetrans-src
          unzip -q /tmp/LiteTrans-source.zip -d /tmp/litetrans-src
          rsync -a --exclude='.github' /tmp/litetrans-src/LiteTrans/ ./

      - name: Apply alpha7 Compose patch
        shell: bash
        run: |
          base64 -d .github/alpha7-patch.py.gz.b64 | gzip -d > /tmp/alpha7-patch.py
          sed -i "s#root=Path('/mnt/data/LiteTrans-src/LiteTrans')#root=Path('.')#" /tmp/alpha7-patch.py
          python3 /tmp/alpha7-patch.py
          sed -i 's/newFixedThreadPool(3/newFixedThreadPool(2/' app/src/main/java/com/litetrans/module/service/TranslationService.java

      - name: Apply alpha8 ML Kit process fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path('app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          s = s.replace('\n            android:process=":translator" />', ' />')
          if 'android:process=":translator"' in s:
              raise SystemExit('translator secondary process still present')
          manifest.write_text(s)

          gradle = Path('app/build.gradle')
          s = gradle.read_text().replace('versionCode 7', 'versionCode 8').replace("versionName '0.1.0-alpha7'", "versionName '0.1.0-alpha8'")
          gradle.write_text(s)

          main = Path('app/src/main/java/com/litetrans/module/ui/MainActivity.java')
          s = main.read_text().replace('LiteTrans 0.1.0-alpha7', 'LiteTrans 0.1.0-alpha8').replace('Alpha7 重点', 'Alpha8 重点')
          old = 'try { bindService(new Intent(this, TranslationService.class), connection, Context.BIND_AUTO_CREATE); }\n        catch (Throwable t) { status.setText("翻译服务连接失败：" + t.getClass().getSimpleName()); }'
          new = 'try { boolean ok = bindService(new Intent(this, TranslationService.class), connection, Context.BIND_AUTO_CREATE); if (!ok) status.setText("翻译服务连接失败：bindService=false"); }\n        catch (Throwable t) { status.setText("翻译服务连接失败：" + t.getClass().getSimpleName()); }'
          if old not in s:
              raise SystemExit('bindTranslator anchor missing')
          s = s.replace(old, new)
          main.write_text(s)
          PY

          echo '--- verify alpha8 patch ---'
          grep -n "versionCode\|versionName" app/build.gradle
          grep -n "TranslationService" -A3 app/src/main/AndroidManifest.xml
          grep -n "alpha8\|bindService=false" app/src/main/java/com/litetrans/module/ui/MainActivity.java
          ! grep -q 'android:process=":translator"' app/src/main/AndroidManifest.xml

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiteTrans-0.1.0-alpha8-compose-mlkit-fix-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
